<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
        <style>
            h2{
                color:pink;
                background-color:black
            }
             h3{
                color:burlywood;
                background:brown;
            }
        </style>
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cách 1: Inline Style-->
     <!-- color: quy định màu chữ-->
      <!-- background-color: quy định màu nền -->
    <h1 style="color:blue; background-color: orange;">Bài STYLE</h1>

    <!-- Cách 2: Internal Style-->
     <h2>Cách 2 Internal Style</h2>
     <h3>Lê Huệ</h3>

     <!-- Cách 3: External Style -->
        <h4>External Style</h4>
</body>
</html>
