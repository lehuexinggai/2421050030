    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Style</title>
            <style>
                h2{
                    color:chocolate;
                    background-color:blue
                }
                .khoi-1{
                    background-color:red;
                }
                .khoi-2{
                    background-color:blue;
                    /* margin truyền 1 giá trị thì sẽ cách xung quanh bằng giá trị đó*/
                     /* 2 giá trị: giá trị đầu (trên dưới) giá trị 2 (trái phải)*/
                     /* 4 giá trị: trên, phải, dưới, trái*/
                    margin: 10px 50px 100px 200px;
                    
                }
                .khoi-3{
                    background-color:green;
                    padding: 10px 50px 100px 200px;
                    
                }
            </style>
            <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="khoi-1">Khối 1</div>
         <div class="khoi-2">Khối 2</div>
          <div class="khoi-3">Khối 3</div>
 <!--  bắt buộc dùng display flex 
   dùng justify-content gồm 5 thộc tính để di chuyển theo chiều ngang
   flex-start: sang trái
   flex-end: sang phải
   center: giữa
   space-between: phân bố đều
   space-around: phân bố đều với khoảng cách xung quanh
-->
   <!--dùng display flex 
   dùng align-items để di chuyển theo chiều dọc
   flex-start: lên trên
   flex-end: xuống dưới
   center: giữa
   baseline: căn theo đường cơ sở
   stretch: kéo dài theo chiều dọc
-->
